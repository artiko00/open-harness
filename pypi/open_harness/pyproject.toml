[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-harness"
version = "0.2.0"
description = "The full open-harness suite — linelens, dupelens, secretlens, testlens — in one install"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jassen Castillo", email = "castillo.cristianj@gmail.com" }]
keywords = ["linter", "code-quality", "duplication", "secrets", "testing", "pre-commit", "ci"]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "open-harness-linelens==0.2.0",
  "open-harness-dupelens==0.2.0",
  "open-harness-secretlens==0.2.0",
  "open-harness-testlens==0.2.0",
]

[project.urls]
Homepage = "https://github.com/artiko00/open-harness"
Repository = "https://github.com/artiko00/open-harness"
Issues = "https://github.com/artiko00/open-harness/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
