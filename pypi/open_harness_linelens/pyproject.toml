[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-harness-linelens"
version = "0.1.3"
description = "File length linter for any language — single native binary, zero runtime deps"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jassen Castillo", email = "castillo.cristianj@gmail.com" }]
keywords = ["linter", "code-quality", "lines", "pre-commit", "ci"]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/artiko00/open-harness"
Repository = "https://github.com/artiko00/open-harness"
Issues = "https://github.com/artiko00/open-harness/issues"

[project.scripts]
linelens = "open_harness_linelens.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_harness_linelens = ["bin/*"]
