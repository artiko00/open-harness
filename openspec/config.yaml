# OpenSpec configuration for open-harness
# Spec-Driven Development entry point for AI agents working on this repo.
# See https://siemprelisto.cl/tecnologias/openspec/15-llm-mejores-practicas/

context:
  project: open-harness
  description: >
    Monorepo of 4 zero-dependency Go quality linters (linelens, dupelens,
    secretlens, testlens) distributed as a single native binary per tool.
    Each tool is also published to npm as @open_harness/<tool> with native
    binary wheels per platform (linux-x64, darwin-arm64, darwin-x64,
    win32-x64). Roadmap targets PyPI (pip) and Packagist (composer)
    distribution.
  stack:
    language: Go 1.22+
    runtime: native binaries (single static executable per tool)
    workspace: Go workspace (go.work)
    testing: Go stdlib testing package
    dependencies: stdlib only (zero external runtime deps — ADR-002)
    hooks: lefthook (pre-commit + pre-push)
    config: JSON files per tool + optional package.json key (ADR-014)
    distribution_channels:
      - npm (live): "@open_harness/{linelens, dupelens, secretlens, testlens, open-harness}"
      - PyPI (planned, F-012)
      - Packagist (planned, F-013)
      - GitHub Releases (planned, F-011)
  tools_versions:
    linelens: 0.1.3
    dupelens: 0.1.3
    secretlens: 0.1.2
    testlens: 0.1.2
    open-harness-meta: 0.1.0
  conventions:
    - All files MUST stay under 100 lines (linelens.json enforces; tests up to 300)
    - All new code MUST follow TDD: red → green → refactor (ADR-013)
    - Tools MUST keep 100% statement coverage (ADR-011)
    - main.go MUST use osExit variable + run([]string) int pattern + flag.ContinueOnError
    - Errors MUST wrap with fmt.Errorf("context: %w", err)
    - Architectural decisions MUST be documented as ADRs in docs/

rules:
  proposal:
    - MUST state the user-facing problem before proposing a solution
    - MUST link to the feature ID in .agent/feature-list.json (e.g. F-011)
    - SHOULD list affected tools (linelens / dupelens / secretlens / testlens)
    - MUST capture in-scope and out-of-scope as separate bullet lists
    - SHOULD include rough estimate of risk (low / medium / high)
    - MUST NOT propose adding external Go runtime dependencies without a paired ADR
  specs:
    - MUST use RFC 2119 keywords (MUST, SHOULD, MAY) for every requirement
    - Each MUST requirement MUST have at least one scenario (Given / When / Then)
    - Scenarios MUST use exactly 4 hashtags as section heading (####)
    - Delta specs MUST copy complete requirement blocks under the MODIFIED section
    - MUST reference exact tool versions from context.tools_versions, not from memory
    - SHOULD list edge cases as separate scenarios, not as bullet points inside one
  design:
    - MUST justify any deviation from the philosophy in ADR-001/002/005/011/013
    - MUST list the architecture decision impact (creates ADR-N? extends ADR-N?)
    - MUST describe the testing strategy (TDD phases + coverage target)
    - SHOULD include a sequence or component diagram in mermaid when control flow is non-trivial
    - MUST NOT design for hypothetical future requirements (KISS / YAGNI)
  tasks:
    - MUST be ordered: tests first (red) → implementation (green) → refactor → docs
    - Each task SHOULD be ≤ 1 hour of focused work
    - MUST mark completed tasks with [done], skipped with [skip] + reason
    - MUST NOT mark [done] if tests are failing or coverage dropped below 100%
    - Quality-gate tasks (linelens/dupelens/secretlens/testlens check --fail) MUST appear at the end
    - SHOULD include "update .agent/claude-progress.txt" as the closing task

change_naming:
  format: kebab-case
  verbal_prefixes:
    - add-     # new tool, new feature
    - update-  # extend existing tool
    - fix-     # bugfix
    - refactor- # restructure without behavior change
    - remove-  # deprecate / delete
  examples:
    - add-bigo-tool
    - update-linelens-report-subcommand
    - fix-dupelens-snippet-overflow
    - refactor-shared-glob-helpers
    - remove-deprecated-flag-threshold
