[tool.poetry]
name = "demo"
version = "0.1.0"
description = """
Un proyecto de ejemplo
con descripcion multilinea.
"""
authors = ["Ada <ada@example.com>"]
readme = 'README.md'

[tool.poetry.dependencies]
python = "^3.11"
requests = { version = "^2.31", extras = ["socks"] }
pydantic = [
    { version = "^2.0", python = ">=3.11" },
    { version = "^1.10", python = "<3.11" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.ruff]
line-length = 88
select = ['E', 'F', 'I']
exclude = [
    "migrations",   # generado
    ".venv",
]

[tool.mypy]
python_version = "3.11"
"module.legacy" = 1

[tool.linelens]
maxLines = 120
exclude = [
    "vendor/**",
    "build/**",
]
