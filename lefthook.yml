pre-commit:
  commands:
    linelens:
      run: tools/linelens/linelens check --fail --no-color
    dupelens:
      run: tools/dupelens/dupelens check --fail --no-color
    secretlens:
      run: tools/secretlens/secretlens check --fail --no-color
    testlens:
      run: tools/testlens/testlens check --lang go --dir tools/ --fail
    scopelens:
      run: tools/scopelens/scopelens check --fail --no-color

pre-push:
  parallel: true
  commands:
    test-linelens:
      run: cd tools/linelens && go test ./...
    test-dupelens:
      run: cd tools/dupelens && go test ./...
    test-secretlens:
      run: cd tools/secretlens && go test ./...
    test-testlens:
      run: cd tools/testlens && go test ./...
    test-scopelens:
      run: cd tools/scopelens && go test ./...
    test-shared:
      run: for m in tools/_shared/*/; do (cd "$m" && go test ./...) || exit 1; done
